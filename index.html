<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spread The Love</title>
  <meta name="theme-color" content="#ffedcb" />
  <style>
    /* Everything is sized for a 1440px-wide screen and scales with the
       window width from there (16px text at 1440 = 1.111vw). The frame's
       border and corner sizes are set from main.js as --frame-border and
       --frame-radius, since the canvas draws the frame itself. */
    :root {
      --frame-border: 20px;
      --frame-radius: 32px;
      --frame-color: #ffedcb;
      --ink: #211d1e;
      --ink-line: 2px;
      font-size: clamp(14px, 1.111vw, 24px);
    }
    html, body { margin: 0; height: 100%; background: var(--frame-color); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    @font-face {
      font-family: "BD Karlo";
      src: url("./assets/fonts/BDKarlo.woff2") format("woff2");
      font-display: block;
    }
    /* --u is one pixel of the 1440px-wide design, so everything below can be
       measured straight off the mockup and still scales with the window. */
    :root { --u: calc(100vw / 1440); }

    .title {
      position: fixed;
      inset: 0 0 auto 0;
      margin: 0;
      pointer-events: none;
      font-family: "BD Karlo", ui-rounded, system-ui, sans-serif;
      font-weight: normal;
      color: var(--frame-color);
      text-transform: uppercase;
      line-height: 1;
    }
    .title > span { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    /* Letters are separate so each can lean a little (set from main.js).
       The outline and shadow are drawn around all of them together by the
       SVG filters below, so overlapping letters merge into one shape. */
    .title > span > span { display: inline-block; transform: rotate(calc(var(--lean, 0) * 1deg)); }
    .title__small {
      top: calc(var(--title-small-top, 83) * var(--u));
      font-size: calc(var(--title-small-size, 38.5) * var(--u));
      letter-spacing: 0.01em;
      filter: url(#title-small-ink);
      transform: translateX(calc(var(--title-small-x, 0) * var(--u) + 0.005em)) rotate(calc(var(--title-small-rotate, 0) * 1deg));
    }
    .title__big {
      top: calc(var(--title-big-top, 113) * var(--u));
      font-size: calc(var(--title-big-size, 147) * var(--u));
      letter-spacing: -0.04em;
      filter: url(#title-big-ink);
      transform-origin: 50% 50%;
      /* -0.02em re-centers the letters after the negative letter spacing. */
      transform: translateX(calc(var(--title-big-x, -4) * var(--u) - 0.02em))
        perspective(calc(900 * var(--u)))
        rotateY(calc(var(--title-big-turn, -5) * 1deg))
        rotate(calc(var(--title-big-rotate, 3.5) * 1deg));
    }

    /* Spread picker: five ink-outlined dots on a gentle curve. */
    .flavors {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
      pointer-events: none;
    }
    .flavor {
      position: absolute;
      left: calc(var(--x) * var(--u));
      top: calc(var(--y) * var(--u));
      width: calc(40 * var(--u));
      height: calc(40 * var(--u));
      min-width: 22px;
      min-height: 22px;
      transform: translate(-50%, -50%);
      padding: 0;
      border: calc(2.5 * var(--u)) solid var(--ink);
      border-radius: 50%;
      background: var(--color);
      box-shadow: calc(6 * var(--u)) calc(6 * var(--u)) 0 var(--ink);
      cursor: pointer;
      pointer-events: auto;
      filter: url(#ink-wobble);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
    }
    .flavor:hover { transform: translate(-50%, -50%) translate(-1px, -2px) scale(1.06); box-shadow: calc(8 * var(--u)) calc(8 * var(--u)) 0 var(--ink); }
    .flavor:active { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--ink); }
    .flavor:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    .flavor[aria-pressed="true"] { transform: translate(-50%, -50%) translate(3px, 3px); box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 var(--ink); }

    /* Phones: the titles go a bit bigger and the dots line up in a row at
       the bottom, where thumbs can reach them. */
    @media (max-width: 700px) {
      :root { --u: calc(100vw / 760); }
      .flavor {
        left: calc(50% + (var(--i) - 2) * 56px);
        top: auto;
        bottom: calc(var(--frame-border) + 28px + env(safe-area-inset-bottom, 0px));
        width: 40px;
        height: 40px;
        border-width: 2.5px;
        box-shadow: 4px 4px 0 var(--ink);
        transform: translateX(-50%);
      }
      .flavor:hover { transform: translateX(-50%) translate(-1px, -2px) scale(1.06); box-shadow: 5px 5px 0 var(--ink); }
      .flavor:active, .flavor[aria-pressed="true"] { transform: translateX(-50%) translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    }

    /* Mockup overlay for checking positions. */
    .layout-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 5;
    }
    .layout-overlay[hidden] { display: none; }

    /* Keep the slider panel inside the frame. */
    .lil-gui.autoPlace {
      top: calc(var(--frame-border) + 0.75rem);
      right: calc(var(--frame-border) + 0.75rem);
      max-height: calc(100% - 2 * var(--frame-border) - 1.5rem);
      border-radius: calc(var(--frame-radius) * 0.4);
      overflow: hidden auto;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <h1 class="title" aria-label="Pick your spread">
    <span class="title__small" aria-hidden="true"><span>P</span><span>i</span><span>c</span><span>k</span> <span>y</span><span>o</span><span>u</span><span>r</span></span>
    <span class="title__big" aria-hidden="true"><span>S</span><span>p</span><span>r</span><span>e</span><span>a</span><span>d</span></span>
  </h1>
  <ul class="flavors" aria-label="Spread flavors"></ul>
  <!-- Gives the titles and buttons the same hand-drawn wobble as the toast.
       The title filters also draw one ink outline (a grown copy of all the
       letters together) and a hard shadow behind it. main.js keeps the
       outline width and shadow offset in step with the window size. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="title-big-ink" x="-10%" y="-20%" width="120%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
      <feFlood flood-color="#211d1e" result="ink" />
      <feComposite in="ink" in2="grown" operator="in" result="outline" />
      <feOffset in="outline" dx="6" dy="8" result="shadow" />
      <feMerge result="drawn">
        <feMergeNode in="shadow" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" result="grain" />
      <feDisplacementMap in="drawn" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="title-small-ink" x="-10%" y="-30%" width="120%" height="170%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
      <feFlood flood-color="#211d1e" result="ink" />
      <feComposite in="ink" in2="grown" operator="in" result="outline" />
      <feOffset in="outline" dx="3" dy="3.5" result="shadow" />
      <feMerge result="drawn">
        <feMergeNode in="shadow" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" result="grain" />
      <feDisplacementMap in="drawn" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <!-- Same grain and wiggle size as the toast's outlines. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" />
      <feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
