<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spread The Love</title>
  <meta name="theme-color" content="#ffedcb" />
  <style>
    /* Everything is sized for a 1440px-wide screen and scales with the
       window width from there (16px text at 1440 = 1.111vw). The frame's
       border and corner sizes are set from main.js as --frame-border and
       --frame-radius, since the canvas draws the frame itself. */
    :root {
      --frame-border: 20px;
      --frame-radius: 32px;
      --frame-color: #ffedcb;
      --ink: #211d1e;
      font-size: clamp(14px, 1.111vw, 24px);
    }
    html, body { margin: 0; height: 100%; background: var(--frame-color); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .spread-switch {
      position: fixed;
      left: 50%;
      bottom: calc(var(--frame-border) + 1.5rem + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem 1.125rem 0.625rem 0.625rem;
      border: 0.156rem solid var(--ink);
      border-radius: 999px;
      background: #fffaf0;
      color: var(--ink);
      font: 700 1rem/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      box-shadow: 0.19rem 0.19rem 0 var(--ink);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
    }
    .spread-switch:hover { transform: translate(-50%, -1px); box-shadow: 0.25rem 0.25rem 0 var(--ink); }
    .spread-switch:active { transform: translate(-50%, 2px); box-shadow: 0.06rem 0.06rem 0 var(--ink); }
    .spread-switch:focus-visible { outline: 3px solid #a75bd1; outline-offset: 3px; }
    .spread-switch:disabled { opacity: 0.6; cursor: default; }
    .spread-switch__swatch {
      width: 1.375rem;
      height: 1.375rem;
      border-radius: 50%;
      border: 0.125rem solid var(--ink);
      transition: background 0.3s ease;
    }
    /* Keep the slider panel inside the frame. */
    .lil-gui.autoPlace {
      top: calc(var(--frame-border) + 0.75rem);
      right: calc(var(--frame-border) + 0.75rem);
      max-height: calc(100% - 2 * var(--frame-border) - 1.5rem);
      border-radius: calc(var(--frame-radius) * 0.4);
      overflow: hidden auto;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
