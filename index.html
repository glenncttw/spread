<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spread The Love</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4ecdc; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .spread-switch {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px 10px 10px;
      border: 2.5px solid #211d1e;
      border-radius: 999px;
      background: #fffaf0;
      color: #211d1e;
      font: 700 16px/1 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      box-shadow: 3px 3px 0 #211d1e;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s ease;
    }
    .spread-switch:hover { transform: translate(-50%, -1px); box-shadow: 4px 4px 0 #211d1e; }
    .spread-switch:active { transform: translate(-50%, 2px); box-shadow: 1px 1px 0 #211d1e; }
    .spread-switch:focus-visible { outline: 3px solid #a75bd1; outline-offset: 3px; }
    .spread-switch:disabled { opacity: 0.6; cursor: default; }
    .spread-switch__swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #211d1e;
      transition: background 0.3s ease;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
