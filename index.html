<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spread The Love</title>
  <meta name="theme-color" content="#ffedcb" />
  <style>
    /* Everything is sized for a 1440px-wide screen and scales with the
       window width from there (16px text at 1440 = 1.111vw). The frame's
       border and corner sizes are set from main.js as --frame-border and
       --frame-radius, since the canvas draws the frame itself. */
    :root {
      --frame-border: 20px;
      --frame-radius: 32px;
      --frame-color: #ffedcb;
      --ink: #211d1e;
      --ink-line: 2px;
      font-size: clamp(14px, 1.111vw, 24px);
    }
    html, body { margin: 0; height: 100%; background: var(--frame-color); overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    @font-face {
      font-family: "BD Karlo";
      src: url("./assets/fonts/BDKarlo.woff2") format("woff2");
      font-display: block;
    }
    /* --u is one pixel of the 1440px-wide design, so everything below can be
       measured straight off the mockup and still scales with the window. */
    :root { --u: calc(100vw / 1440); }

    .title {
      position: fixed;
      inset: 0 0 auto 0;
      margin: 0;
      pointer-events: none;
      font-family: "BD Karlo", ui-rounded, system-ui, sans-serif;
      font-weight: normal;
      color: var(--frame-color);
      text-transform: uppercase;
      line-height: 1;
    }
    .title > span { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
    /* Letters are separate so each can lean a little (set from main.js).
       The outline and shadow are drawn around all of them together by the
       SVG filters below, so overlapping letters merge into one shape. */
    .title > span > span { display: inline-block; transform: rotate(calc(var(--lean, 0) * 1deg)); }
    .title__small {
      top: calc(var(--title-small-top, 83) * var(--u));
      font-size: calc(var(--title-small-size, 38.5) * var(--u));
      letter-spacing: 0.01em;
      filter: url(#title-small-ink);
      transform: translateX(calc(var(--title-small-x, 0) * var(--u) + 0.005em)) rotate(calc(var(--title-small-rotate, 0) * 1deg));
    }
    .title__big {
      top: calc(var(--title-big-top, 113) * var(--u));
      font-size: calc(var(--title-big-size, 147) * var(--u));
      letter-spacing: -0.04em;
      filter: url(#title-big-ink);
      transform-origin: 50% 50%;
      /* -0.02em re-centers the letters after the negative letter spacing. */
      transform: translateX(calc(var(--title-big-x, -4) * var(--u) - 0.02em))
        perspective(calc(900 * var(--u)))
        rotateY(calc(var(--title-big-turn, -5) * 1deg))
        rotate(calc(var(--title-big-rotate, 3.5) * 1deg));
    }

    /* Spread picker: five ink-outlined dots on a gentle curve. */
    .flavors {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      list-style: none;
      pointer-events: none;
    }
    .flavor {
      /* --px is one design pixel: the 1440px mockup's on big screens, a real
         pixel on phones. GSAP (src/ui.js) tweens --s (hover scale), --lift
         (rises off the page on hover) and --press (pushed in when picked). */
      --px: var(--u);
      --shift-y: -50%;
      --s: 1;
      --lift: 0;
      --press: 0;
      position: absolute;
      left: calc(var(--x) * var(--u));
      top: calc(var(--y) * var(--u));
      width: calc(40 * var(--u));
      height: calc(40 * var(--u));
      min-width: 22px;
      min-height: 22px;
      transform: translate(-50%, var(--shift-y))
        translate(calc(var(--press) * 2.4 * var(--px) - var(--lift) * 1px), calc(var(--press) * 2.4 * var(--px) - var(--lift) * 2px))
        scale(var(--s));
      padding: 0;
      border: calc(2.5 * var(--px)) solid var(--ink);
      border-radius: 50%;
      background: var(--color);
      /* Five stacked hard shadows (Glenn's Figma offsets at 1440px: 0.68,
         1.35, 2, 2.71 and 3.39) blend into one extruded edge. --d scales the
         whole stack: deeper when lifted, shallow when pressed in. */
      --d: calc((1 + 0.4 * var(--lift) - 0.7 * var(--press)) * var(--px));
      box-shadow:
        calc(0.68 * var(--d)) calc(0.68 * var(--d)) 0 var(--ink),
        calc(1.35 * var(--d)) calc(1.35 * var(--d)) 0 var(--ink),
        calc(2 * var(--d)) calc(2 * var(--d)) 0 var(--ink),
        calc(2.71 * var(--d)) calc(2.71 * var(--d)) 0 var(--ink),
        calc(3.39 * var(--d)) calc(3.39 * var(--d)) 0 var(--ink);
      cursor: pointer;
      pointer-events: auto;
      filter: url(#ink-wobble);
      -webkit-tap-highlight-color: transparent;
    }
    .flavor:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

    /* Name label that pops out next to a hovered dot: a cream speech bubble
       with the same ink outline and stacked shadow as the dots. */
    .flavor-label {
      --px: var(--u);
      position: absolute;
      left: calc((var(--x) + 38) * var(--u));
      top: calc(var(--y) * var(--u));
      transform: translateY(-50%);
      pointer-events: none;
    }
    .flavor-label__pill {
      --d: calc(1.3 * var(--px));
      position: relative;
      display: block;
      padding: 0 calc(11 * var(--px));
      height: calc(28 * var(--px));
      border: calc(2.5 * var(--px)) solid var(--ink);
      border-radius: calc(9 * var(--px));
      background: var(--frame-color);
      color: var(--ink);
      font: 800 calc(15 * var(--px)) / 1 Inter, Roboto, "Helvetica Neue", Arial, system-ui, sans-serif;
      line-height: calc(23 * var(--px));
      letter-spacing: -0.01em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow:
        calc(0.68 * var(--d)) calc(0.68 * var(--d)) 0 var(--ink),
        calc(1.35 * var(--d)) calc(1.35 * var(--d)) 0 var(--ink),
        calc(2 * var(--d)) calc(2 * var(--d)) 0 var(--ink),
        calc(2.71 * var(--d)) calc(2.71 * var(--d)) 0 var(--ink),
        calc(3.39 * var(--d)) calc(3.39 * var(--d)) 0 var(--ink);
      filter: url(#ink-wobble);
      visibility: hidden;
    }
    /* The bubble's point: a turned square with ink on two sides, covering
       the bubble's own border where it joins. */
    .flavor-label__pill::before {
      content: "";
      position: absolute;
      left: calc(-6.5 * var(--px));
      top: 50%;
      box-sizing: border-box;
      width: calc(10 * var(--px));
      height: calc(10 * var(--px));
      margin-top: calc(-5 * var(--px));
      background: var(--frame-color);
      border-left: calc(2.5 * var(--px)) solid var(--ink);
      border-bottom: calc(2.5 * var(--px)) solid var(--ink);
      transform: rotate(45deg);
    }

    /* NEXT: the pink circle is drawn by the canvas (see uNext in toon.js);
       this is its clickable area and the word on it, in the title lettering. */
    .next {
      --s: 1;
      --lift: 0;
      position: fixed;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .next:focus-visible { outline: 3px solid var(--ink); outline-offset: -12px; }
    .next__word {
      position: absolute;
      /* From the circle's center, as in the mockup. */
      left: calc(50% - 24 * var(--u));
      top: calc(50% - 27 * var(--u));
      transform: translate(-50%, -50%) rotate(calc(-9deg - var(--lift) * 3deg)) scale(var(--s));
      font-family: "BD Karlo", ui-rounded, system-ui, sans-serif;
      font-size: calc(40 * var(--u));
      line-height: 1;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--frame-color);
      white-space: nowrap;
      filter: url(#title-small-ink);
    }

    /* Phones: the titles go a bit bigger and the dots line up in a row along
       the bottom, where thumbs can reach them, leaving the corner for NEXT.
       Labels pop up above the dots. */
    @media (max-width: 700px) {
      :root { --u: calc(100vw / 760); }
      .flavor, .flavor-label { --px: 1px; }
      .flavor {
        --shift-y: 0%;
        left: calc(var(--frame-border) + 34px + var(--i) * 44px);
        top: auto;
        bottom: calc(var(--frame-border) + 28px + env(safe-area-inset-bottom, 0px));
        width: 32px;
        height: 32px;
        transform: translate(-50%, 0)
          translate(calc(var(--press) * 2.4px - var(--lift) * 1px), calc(var(--press) * 2.4px - var(--lift) * 2px))
          scale(var(--s));
      }
      .flavor-label {
        left: calc(var(--frame-border) + 34px + var(--i) * 44px);
        top: auto;
        bottom: calc(var(--frame-border) + 28px + 48px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
      }
      .flavor-label__pill::before {
        left: 50%;
        top: auto;
        bottom: calc(-6.5 * var(--px));
        margin: 0 0 0 calc(-5 * var(--px));
        transform: rotate(-45deg);
      }
      .next__word {
        left: calc(50% - 20px);
        top: calc(50% - 20px);
        font-size: 24px;
      }
    }

    /* Mockup overlay for checking positions. */
    .layout-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      z-index: 5;
    }
    .layout-overlay[hidden] { display: none; }

    /* Keep the slider panel inside the frame. */
    .lil-gui.autoPlace {
      top: calc(var(--frame-border) + 0.75rem);
      right: calc(var(--frame-border) + 0.75rem);
      max-height: calc(100% - 2 * var(--frame-border) - 1.5rem);
      border-radius: calc(var(--frame-radius) * 0.4);
      overflow: hidden auto;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "gsap": "./vendor/gsap/index.js"
      }
    }
  </script>
</head>
<body>
  <h1 class="title" aria-label="Pick your spread">
    <span class="title__small" aria-hidden="true"><span>P</span><span>i</span><span>c</span><span>k</span> <span>y</span><span>o</span><span>u</span><span>r</span></span>
    <span class="title__big" aria-hidden="true"><span>S</span><span>p</span><span>r</span><span>e</span><span>a</span><span>d</span></span>
  </h1>
  <ul class="flavors" aria-label="Spread flavors"></ul>
  <!-- Gives the titles and buttons the same hand-drawn wobble as the toast.
       The title filters also draw one ink outline (a grown copy of all the
       letters together) and five stacked copies of it behind, which blend
       into one extruded shadow. main.js keeps the
       outline width and shadow offset in step with the window size. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="title-big-ink" x="-10%" y="-20%" width="120%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
      <feFlood flood-color="#211d1e" result="ink" />
      <feComposite in="ink" in2="grown" operator="in" result="outline" />
      <feOffset in="outline" data-step="0.2" result="s1" />
      <feOffset in="outline" data-step="0.4" result="s2" />
      <feOffset in="outline" data-step="0.6" result="s3" />
      <feOffset in="outline" data-step="0.8" result="s4" />
      <feOffset in="outline" data-step="1" result="s5" />
      <feMerge result="drawn">
        <feMergeNode in="s5" />
        <feMergeNode in="s4" />
        <feMergeNode in="s3" />
        <feMergeNode in="s2" />
        <feMergeNode in="s1" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" result="grain" />
      <feDisplacementMap in="drawn" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="title-small-ink" x="-10%" y="-30%" width="120%" height="170%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="grown" />
      <feFlood flood-color="#211d1e" result="ink" />
      <feComposite in="ink" in2="grown" operator="in" result="outline" />
      <feOffset in="outline" data-step="0.2" result="s1" />
      <feOffset in="outline" data-step="0.4" result="s2" />
      <feOffset in="outline" data-step="0.6" result="s3" />
      <feOffset in="outline" data-step="0.8" result="s4" />
      <feOffset in="outline" data-step="1" result="s5" />
      <feMerge result="drawn">
        <feMergeNode in="s5" />
        <feMergeNode in="s4" />
        <feMergeNode in="s3" />
        <feMergeNode in="s2" />
        <feMergeNode in="s1" />
        <feMergeNode in="outline" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" result="grain" />
      <feDisplacementMap in="drawn" in2="grain" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="ink-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <!-- Same grain and wiggle size as the toast's outlines. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="1" seed="1" />
      <feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
